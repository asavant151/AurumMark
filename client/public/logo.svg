<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Royal Purple) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Diamond Crown Highlight -->
    <linearGradient id="diamondCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Diamond Pavilion Gradients -->
    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.5" />
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Luxury Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="114" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.5" />

  <!-- Watermark Radial Precision Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 8" stroke-opacity="0.35" />

  <!-- Diamond & Watermark Seal Group -->
  <g transform="translate(0, 8)">
    <!-- Pavilion Drop Shadow / Glow -->
    <polygon points="120,205 392,205 256,380" fill="#2E1065" opacity="0.45" filter="url(#softGlow)" />

    <!-- Crown Table (Top horizontal facet) -->
    <polygon points="180,140 332,140 392,205 120,205" fill="url(#diamondCrown)" />

    <!-- Crown Triangles -->
    <!-- Center Crown Triangle -->
    <polygon points="216,140 296,140 256,205" fill="#FFFFFF" />
    <!-- Left Crown Kite -->
    <polygon points="180,140 216,140 256,205 120,205" fill="#EEF2FF" opacity="0.92" />
    <!-- Right Crown Kite -->
    <polygon points="296,140 332,140 392,205 256,205" fill="#E0E7FF" opacity="0.88" />

    <!-- Pavilion Center Facet -->
    <polygon points="216,205 296,205 256,375" fill="url(#facetCenter)" />

    <!-- Pavilion Left Inner Facet -->
    <polygon points="160,205 216,205 256,375" fill="url(#facetLeft)" />

    <!-- Pavilion Left Outer Facet -->
    <polygon points="120,205 160,205 256,375" fill="#A78BFA" opacity="0.7" />

    <!-- Pavilion Right Inner Facet -->
    <polygon points="296,205 352,205 256,375" fill="url(#facetRight)" />

    <!-- Pavilion Right Outer Facet -->
    <polygon points="352,205 392,205 256,375" fill="#8B5CF6" opacity="0.7" />

    <!-- Gold Watermark Stamp Grid Overlay on Diamond -->
    <!-- Gold Girdle Rim -->
    <line x1="120" y1="205" x2="392" y2="205" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Gold Central Hallmark Crest -->
    <circle cx="256" cy="205" r="14" fill="url(#goldGrad)" />
    <circle cx="256" cy="205" r="7" fill="#FFFFFF" />

    <!-- Gold Pavilion Spine -->
    <line x1="256" y1="219" x2="256" y2="375" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.9" />

    <!-- 4-Point Brilliance Sparkle Top-Right -->
    <path d="M 390 100 Q 390 135 425 135 Q 390 135 390 170 Q 390 135 355 135 Q 390 135 390 100 Z" fill="url(#goldGrad)" />
    <circle cx="390" cy="135" r="4" fill="#FFFFFF" />

    <!-- 4-Point Sub-Sparkle Bottom-Left -->
    <path d="M 125 330 Q 125 352 147 352 Q 125 352 125 374 Q 125 352 103 352 Q 125 352 125 330 Z" fill="url(#goldGrad)" opacity="0.85" />
    <circle cx="125" cy="352" r="3" fill="#FFFFFF" />
  </g>
</svg>
